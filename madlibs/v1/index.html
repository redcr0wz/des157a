<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Knewave&family=Metal+Mania&family=Shadows+Into+Light+Two&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <!-- <script src="script.js" defer></script>  -->
    <title>METAL MAD LIBS</title>
</head>
<body>
    <section id="notebook">
        <form>
            <button type="back" id="backbtn">&larr;</button>
            <label for="text">
                <h3>GIVE ME A...</h3>
                <h2>NOUN</h2> 
            </label>
            <input type="text" placeholder="person place or thing">
            <button type="submit" id="nextbtn">&rarr;</button>
        </form>
    </section>

    <section id="final-madlib">
        <div id="lyrics">
            <h2>[word used before] BY THE [plural noun]</h2>
            <p>IN THE DEPTHS OF [place]</p>
            <p>[verbing] IN SILENCE</p>
            <p>COMES A DEADLY [animal]</p>
            <p>LIKE [tragic event] REBORN</p>
            <p>NOW HUMANITY BRINGS [negative emotion as a noun]</p>
            <p>[vulgar exclamation]!</p>
            <p>EVERY [time period]</p>
            <p>TO BRING [something scary]</p>
        </div>
    </section>
</body>
</html>
